[pytest]
markers =
    integration: tests that call external services (e.g., Supabase)
filterwarnings =
    ignore:.*enablePackrat.*:pyparsing.util.PyparsingDeprecationWarning
    ignore:.*escChar.*:pyparsing.util.PyparsingDeprecationWarning
    ignore:.*unquoteResults.*:pyparsing.util.PyparsingDeprecationWarning
    ignore:.*@model_validator.*:pydantic.warnings.PydanticDeprecatedSince212
    ignore:.*timeout parameter is deprecated.*:DeprecationWarning
    ignore:.*verify parameter is deprecated.*:DeprecationWarning
    ignore::DeprecationWarning:supabase._sync.client
